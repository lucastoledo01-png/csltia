# ChatbotX for Easypanel/Traefik deployment
# Deploy with: docker-compose -f docker-compose.chatbotx.yml --env-file .env up -d

name: chatbotx

x-network: &network
  networks:
    - chatbotx-network

x-service-common: &service-common
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    - ./.env
  <<: *network

x-rustfs-environment: &rustfs-environment
  RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-chatbotx}
  RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-secretkey}
  RUSTFS_API_CORS_ALLOW_ORIGIN: ${RUSTFS_API_CORS_ALLOW_ORIGIN:-*}

services:
  postgres:
    <<: *service-common
    image: timescale/timescaledb-ha:pg18-all
    volumes:
      - chatbotx-db-data:/home/postgres/pgdata
    command: ["postgres", "-c", "log_statement=none"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatbotx}
      - POSTGRES_USER=${POSTGRES_USER:-chatbotx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secretkey}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *service-common
    image: redis:8-alpine
    volumes:
      - chatbotx-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  filesystem:
    <<: *service-common
    image: rustfs/rustfs:latest
    command: server /data --console-address ":9001"
    environment:
      <<: *rustfs-environment
    volumes:
      - chatbotx-filesystem-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  filesystem-init:
    <<: *service-common
    image: rustfs/rc:latest
    depends_on:
      filesystem:
        condition: service_healthy
    environment:
      <<: *rustfs-environment
    entrypoint: >
      /bin/sh -c "rc alias set local http://filesystem:9000
      $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY}; rc mb local/chatbotx
      --ignore-existing; touch /tmp/empty && rc cp /tmp/empty
      local/chatbotx/public/; rc anonymous set public local/chatbotx/public;"

  builder:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/builder/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    environment:
      - RUN_DB_MIGRATE=true
      - RUN_DB_SEED=true
    labels:
      traefik.enable: "true"
      traefik.http.routers.chatbotx.rule: "Host(`chatbotx.casaloti.ia.br`)"
      traefik.http.routers.chatbotx.entrypoints: "websecure"
      traefik.http.routers.chatbotx.tls: "true"
      traefik.http.routers.chatbotx.tls.certresolver: "letsencrypt"
      traefik.http.services.chatbotx.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/worker/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    environment:
      - JAVASCRIPT_EXECUTOR_URL=http://javascript-executor:3210

  javascript-executor:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/javascript-executor/docker/Dockerfile
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:-change-me-in-production-at-least-32-chars}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  chatbotx-network:
    driver: bridge
    external: false

volumes:
  chatbotx-db-data:
  chatbotx-redis-data:
  chatbotx-filesystem-data:
